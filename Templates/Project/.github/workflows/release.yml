name: Release

# Builds, packs and uploads a Velopack release to GitHub Releases.
#
#   Trigger A - tag push (recommended):
#     git tag v1.0.2 && git push origin v1.0.2
#
#   Trigger B - manual run from the Actions tab:
#     "Run workflow" > enter a version > optional channel / pre-release
#
# The version is taken from the pushed tag (Trigger A) or the input
# (Trigger B). Publishing requires no PAT: the built-in GITHUB_TOKEN with
# `contents: write` is enough. Release logic lives in
# Scripts/build-and-release.ps1 (single source of truth, runnable locally too).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.2 (must be higher than the latest)"
        required: true
        type: string
      channel:
        description: "Release channel"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - alpha
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build & publish
    runs-on: windows-latest
    # Uploading ~800MB of assets at ~2-3 Mbps takes ~15 min even parallel;
    # keep headroom for slow days (the serial era tripped 45 min).
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install vpk (Velopack CLI)
        run: dotnet tool install --global vpk

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "${{ inputs.version }}" }
          $version = $version.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not determine a version." }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag=v$version" >> $env:GITHUB_OUTPUT

          # Detect channel from tag name (e.g., v0.0.1-beta -> beta)
          $channel = "stable"
          if ($version -match "-beta$") { $channel = "beta" }
          elseif ($version -match "-alpha$") { $channel = "alpha" }
          Write-Output "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Guard tag matches csproj
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [xml]$xml = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "DevTemWinUi3.csproj")
          $info = $xml.Project.PropertyGroup |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_.InformationalVersion) } |
            Select-Object -First 1 -ExpandProperty InformationalVersion
          $plain = $xml.Project.PropertyGroup |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_.Version) } |
            Select-Object -First 1 -ExpandProperty Version
          Write-Host "Tag version: $env:VERSION; csproj Version: $plain; InformationalVersion: $info"
          if ($env:VERSION -ne $info) {
            throw "Tag v$env:VERSION disagrees with csproj InformationalVersion ($info). Bump the csproj first (AGENTS.md Versioning)."
          }

      - name: Generate release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Prefer the CHANGELOG.md section for this version; fall back to
          # the stub when the version has no section (never fail the release
          # over notes — the guard above already enforced version agreement).
          $notes = ""
          $changeLog = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          if (Test-Path -LiteralPath $changeLog) {
            $lines = Get-Content -LiteralPath $changeLog
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match ('^## \[' + [regex]::Escape($env:VERSION) + '\]')) { $start = $i; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^## ') { $end = $i; break }
              }
              $body = @()
              for ($i = $start + 1; $i -lt $end; $i++) { $body += $lines[$i] }
              $notes = "## DevTem-WinUI 3 $env:VERSION`n`n" + ($body -join "`n").Trim("`n")
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = @(
              "## DevTem-WinUI 3 $env:VERSION",
              "",
              "Automated release built from commit ``$env:SHA``.",
              "",
              "For a full list of changes, see the [commits](https://github.com/$env:REPO/commits/$env:TAG)."
            ) -join "`n"
          }
          Set-Content -Path ReleaseNotes.md -Value $notes

      - name: Build, pack & upload
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ github.event_name == 'push' && steps.version.outputs.channel || inputs.channel }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $releaseArgs = @{
            Version      = $env:VERSION
            Channel      = $env:CHANNEL
            Runtime      = "win-x64"
            ReleaseNotes = "ReleaseNotes.md"
            Download     = $true
            Publish      = $true
            Tag          = $env:TAG
          }
          if ($env:PRERELEASE -eq "true") { $releaseArgs["PreRelease"] = $true }
          & ./Scripts/build-and-release.ps1 @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "Release script failed with exit code $LASTEXITCODE" }

  # Dual-track MSIX leg: same tag, same version — packs the Store upload
  # (.msixupload) from the runtime-adaptive binary and attaches it to the
  # GitHub Release (doubles as the sideload feed host). Skips gracefully
  # when DEVTEM_MSIX_PUBLISHER is unset (forks stay green); Store
  # submission itself stays manual (store-submit.yml) or publish-store.ps1.
  msix:
    name: MSIX upload (dual-track)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve tag
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "push") { "${{ github.ref_name }}" } else { "v${{ inputs.version }}" }
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Store upload (or skip without a Publisher)
        shell: pwsh
        env:
          PUBLISHER: ${{ secrets.DEVTEM_MSIX_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            Write-Host "DEVTEM_MSIX_PUBLISHER unset - skipping MSIX leg (Velopack release above is unaffected)."
            return
          }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Scripts/build-msix.ps1 -Validate -Publisher "$env:PUBLISHER"
          if ($LASTEXITCODE -ne 0) { throw "MSIX pre-flight failed with exit code $LASTEXITCODE" }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Scripts/build-msix.ps1 -StoreUpload -Publisher "$env:PUBLISHER"
          if ($LASTEXITCODE -ne 0) { throw "MSIX upload build failed with exit code $LASTEXITCODE" }

      - name: Attach .msixupload to the release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHER: ${{ secrets.DEVTEM_MSIX_PUBLISHER }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PUBLISHER)) {
            Write-Host "DEVTEM_MSIX_PUBLISHER unset - nothing to attach."
            return
          }
          $uploads = @(Get-ChildItem -LiteralPath "Releases/Msix" -Filter "*.msixupload" -ErrorAction SilentlyContinue)
          if ($uploads.Count -eq 0) { throw "No .msixupload found under Releases/Msix." }
          foreach ($u in $uploads) {
            & gh release upload "$env:TAG" $u.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
          }