name: ui-tests

# FlaUI smoke tests: launch the real exe, navigate, switch theme/language.
# Runs once against the default app — never on the template matrix
# (template flag-off runtime proof stays manual screenshots).
#
# Display: windows-latest runners provide an interactive desktop session,
# so FlaUI drives a real window with no Xvfb/headless setup (Windows-only
# luxury — do not copy this file to Linux CI). Local runs need a quiet
# desktop instead (see docs/WORKFLOW.md fragile points): UIA reads work
# occluded, mouse clicks don't.

on:
  push:
    branches: [main]
    paths:
      - "UI/**"
      - "MainWindow.xaml*"
      - "Pages/*.xaml"
      - "Pages/*.xaml.cs"
      - "Services/**"
      - "ViewModels/**"
      - "App.xaml*"
      - "Program.cs"
      - ".github/workflows/ui-tests.yml"
  pull_request:
    paths:
      - "UI/**"
      - "MainWindow.xaml*"
      - "Pages/*.xaml"
      - "Pages/*.xaml.cs"
      - "Services/**"
      - "ViewModels/**"
      - "App.xaml*"
      - "Program.cs"
      - ".github/workflows/ui-tests.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution (app + unit + smoke)
        run: dotnet build DevTemWinUi3.sln -c Debug -p:Platform=x64
      # Retry-with-evidence (E2): a flaky UI pass re-runs ONCE automatically
      # — no human re-runs to get green. Both runs' screenshots + logs
      # upload below, so a green retry still files its evidence.
      - name: FlaUI smoke tests (attempt 1)
        id: smoke1
        continue-on-error: true
        run: dotnet test UI/DevTemWinUi3.SmokeTests/DevTemWinUi3.SmokeTests.csproj -c Debug --no-build -p:Platform=x64 --results-directory UI/TestResults/attempt1
      - name: FlaUI smoke tests (attempt 2, only if attempt 1 failed)
        id: smoke2
        if: steps.smoke1.outcome == 'failure'
        run: dotnet test UI/DevTemWinUi3.SmokeTests/DevTemWinUi3.SmokeTests.csproj -c Debug --no-build -p:Platform=x64 --results-directory UI/TestResults/attempt2
      - name: Fail if both attempts failed
        if: steps.smoke1.outcome == 'failure' && (steps.smoke2.outcome == 'failure' || steps.smoke2.outcome == 'skipped')
        run: exit 1
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: UI/**/TestResults/**
      - name: Upload app log (startup timing + crash evidence)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-app-log
          path: bin/**/Logs/**
