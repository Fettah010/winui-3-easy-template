name: templates

# Scaffold matrix: PRs run the Fast subset, main pushes / nightly /
# templates-v* tags run the full matrix (see -Profile in
# Scripts/test-templates.ps1 and the tier table in docs/WORKFLOW.md).
# Publishing lives in templates-publish.yml (tag-driven, no paths filter).

on:
  # Main pushes and release tags always run the full matrix (no paths
  # filter: the tag commit itself may touch nothing matrix-relevant, but
  # the release must still prove every combo).
  push:
    branches: [main]
    tags: ["templates-v*"]
  pull_request:
    paths:
      - "Templates/**"
      - "Packaging/**"
      - "Scripts/test-templates.ps1"
      - "Scripts/test-mirror-parity.ps1"
      - "Scripts/register-protocol.ps1"
      - "Scripts/build-msix.ps1"
      - "Scripts/publish-store.ps1"
      - "Scripts/bump-version.ps1"
      - "Scripts/submit-store.ps1"
      - "Scripts/new-store-listing.ps1"
      - "Scripts/measure-publish-weight.ps1"
      - "docs/publish-weight-baseline.json"
      - ".github/workflows/store-submit.yml"
      - ".github/workflows/release.yml"
      - "Services/**"
      - "Pages/**"
      - "ViewModels/**"
      - "Controls/**"
      - "Assets/**"
      - "**.csproj"
      - "**.sln"
      - ".github/workflows/templates.yml"
      - "Tests/**"
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Mirror parity (app vs Templates/Project)
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Scripts/test-mirror-parity.ps1
      - name: register-protocol dry run (writes nothing)
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Scripts/register-protocol.ps1 -Scheme "devtem-ci-probe://" -ExePath "$env:SystemRoot\System32\notepad.exe" -WhatIf
      # PRs prove the Fast subset (allon + alloff + one msix); main,
      # nightly, and release tags prove the full matrix (E1 cost control).
      - name: Scaffold matrix, Fast subset (PR)
        if: github.event_name == 'pull_request'
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Scripts/test-templates.ps1 -Profile Fast
      - name: Scaffold matrix, full (main/nightly/tag)
        if: github.event_name != 'pull_request'
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Scripts/test-templates.ps1
  weight:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish weight gate (>10% jump fails)
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File Scripts/measure-publish-weight.ps1 -FailOnJump
